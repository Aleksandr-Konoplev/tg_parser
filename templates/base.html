<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}tg-parser{% endblock %}</title>
    <!-- Bootstrap 5 CSS (тёмная тема) -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <!-- Bootstrap Icons -->
    <link href="/static/css/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <!-- Кастомные стили -->
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    {% if user %}
    <!-- Сайдбар для авторизованных пользователей -->
    <div class="d-flex">
        <!-- Боковое меню -->
        <nav class="sidebar d-flex flex-column flex-shrink-0 p-3 bg-dark" style="width: 250px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; border-right: 1px solid var(--bs-border-color);">
            <!-- Заголовок -->
            <a href="/" class="d-flex align-items-center mb-3 text-decoration-none text-white">
                <i class="bi-telegram me-2 fs-4"></i>
                <span class="fs-5 fw-semibold">tg-parser</span>
            </a>
            <hr class="text-secondary">
            <!-- Навигация -->
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}"">
                        <i class="bi-speedometer2 me-2"></i> Дашборд
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/accounts" class="nav-link {% if '/accounts' in request.url.path %}active{% endif %}">
                        <i class="bi-person-lines-fill me-2"></i> Аккаунты
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/channels" class="nav-link {% if '/channels' in request.url.path %}active{% endif %}">
                        <i class="bi-megaphone me-2"></i> Каналы
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/tasks" class="nav-link {% if '/tasks' in request.url.path %}active{% endif %}">
                        <i class="bi-list-task me-2"></i> Задачи
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/posts" class="nav-link {% if '/posts' in request.url.path %}active{% endif %}">
                        <i class="bi-file-text me-2"></i> Посты
                    </a>
                </li>
            </ul>
            <hr class="text-secondary">
            <!-- Информация о пользователе -->
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="bi-person-circle me-2 fs-5"></i>
                    <strong>{{ user.username or user.telegram_id }}</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><a class="dropdown-item" href="/logout"><i class="bi-box-arrow-right me-2"></i>Выйти</a></li>
                </ul>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="main-content ms-auto" style="margin-left: 250px; width: calc(100% - 250px); min-height: 100vh;">
            <div class="container-fluid p-4">
    {% endif %}

                <!-- Основной блок контента -->
                {% block content %}{% endblock %}

    {% if user %}
            </div>
        </main>
    </div>
    {% endif %}

    <!-- Bootstrap 5 JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
