# Reverse proxy: принимает HTTP на порту 80 и проксирует на веб-сервис (web:8000).
# При добавлении HTTPS сюда же добавится server-блок на 443 (Let's Encrypt).

server {
    listen 80;
    listen [::]:80;

    # Принимает запросы по любому имени (и по IP, и по домену).
    # Позже можно сузить до конкретного домена: server_name konoplev-soft.ru www.konoplev-soft.ru;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
